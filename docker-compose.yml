version: '3.8'

services:
  assistant_team:
    build: .
    container_name: assistant_team
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    environment:
      - TZ=Asia/Shanghai
      - PYTHONPATH=/app
    restart: always
    command: python src/launch.py

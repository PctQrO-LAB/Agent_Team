version: '3.8'

services:
  scheduler_agent:
    # === [公] 镜像构建 ===
    # PyCharm 会读取这里，知道通过当前目录的 Dockerfile 来构建环境
    build:
      context: .
      dockerfile: Dockerfile

    container_name: scheduler_agent

    # === [私] 注入环境变量 ===
    # 这里的技巧是：不要把 KEY 写在这里！
    # 而是指定去读取 .env 文件。Git 里不传 .env，只传这个配置。
    # 别人下载代码后，新建一个自己的 .env 填入 KEY 即可。
    env_file:
      - .env

    # === [私] 注入文件 (挂载) ===
    # 左边是你的 Mac 路径，右边是容器内路径。
    # 别人下载代码后，把自己的 json 文件放在项目根目录，Docker 就会自动挂载进去。
    volumes:
      # 1. 挂载代码 (开发模式)：让你在 Mac 上改代码，容器里实时生效
      - .:/app
      # 这句话的意思是：容器里的 /app/.venv 目录给我留个空位，不要用宿主机的那个文件夹覆盖它！
      - /app/.venv

      # 2. 挂载 Google 凭证 (核心机密)
      # 容器启动时，会像“插卡”一样把这两个文件插进去
      - ./credentials.json:/app/credentials.json
      - ./token.json:/app/token.json

      # 3. 挂载数据 (笔记)
      # 确保 Agent 的记忆保存在你本地，而不是容器删了就没了
      - ./data:/app/data

    # === [公] 运行配置 ===
    working_dir: /app

    # 解决时区问题 (北京时间)
    environment:
      - TZ=Asia/Shanghai

    # 保持容器运行，方便 PyCharm 连接
    # 这里的 command 可以是你的主程序，也可以是 tail -f /dev/null (空转等待调试)
    command: python src/main.py
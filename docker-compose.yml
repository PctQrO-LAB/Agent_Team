

services:
  agent_team:
    # === [公] 镜像构建 ===
    # PyCharm 会读取这里，知道通过当前目录的 Dockerfile 来构建环境
    build:
      context: .
      dockerfile: Dockerfile

    container_name: agent_team

    # === [私] 注入环境变量 ===
    # 这里的技巧是：不要把 KEY 写在这里！
    # 而是指定去读取 .env 文件。Git 里不传 .env，只传这个配置。
    # 别人下载代码后，新建一个自己的 .env 填入 KEY 即可。

    # === [私] 注入文件 (挂载) ===
    # 左边是你的 Mac 路径，右边是容器内路径。
    # 别人下载代码后，把自己的 json 文件放在项目根目录，Docker 就会自动挂载进去。

    # === [公] 运行配置 ===
    working_dir: /app

    # 解决时区问题 (北京时间)
    environment:
      - TZ=Asia/Shanghai

    # 保持容器运行，方便 PyCharm 连接
    # 这里的 command 可以是你的主程序，也可以是 tail -f /dev/null (空转等待调试)
    command: python src/launch.py